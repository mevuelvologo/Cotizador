    <p class="hero-tagline">Respondé 6 preguntas y te recomendamos tu plan de suscripción ideal.</p>
  </div>

  <div class="card" id="card">
    <span class="card-label">Cotizador</span>

    <!-- ===================== QUIZ ===================== -->
    <section class="view view-quiz" id="viewQuiz">
      <div class="progress" id="progress" aria-hidden="true"></div>
      <div class="progress-label" id="progressLabel">Pregunta 1 de 6</div>

      <form id="panel" class="panel enter"></form>

      <div class="nav-row">
        <button type="button" class="btn btn-ghost" id="btnPrev">Anterior</button>
        <button type="button" class="btn btn-solid" id="btnNext" disabled>Siguiente</button>
      </div>
    </section>

    <!-- ===================== RESULTADO ===================== -->
    <section class="view view-result hidden" id="viewResult">
      <div class="result-badge">Tu plan recomendado</div>
      <h2 class="result-title" id="resultPlanName">—</h2>

      <div class="price-card">
        <div class="price-eur" id="resultPriceEur">— <span>€/mes</span></div>
        <div class="price-ars" id="resultPriceArs">—</div>
        <div class="price-week" id="resultPriceWeek">—</div>
      </div>

      <p class="result-summary" id="resultSummary">—</p>
      <div class="score-line">Puntaje del diagnóstico: <b id="resultScore">—</b>/18</div>

      <a class="btn-whatsapp" id="ctaWhatsapp" href="#" target="_blank" rel="noopener">

        Consultar por WhatsApp
      </a>
      <div class="secondary-row">
        <button type="button" class="btn-outline" id="btnVerPlan">Ver plan</button>
        <button type="button" class="btn-outline" id="btnComparar">Comparar planes</button>
      </div>

      <div class="restart-row"><button type="button" id="btnRestart">Volver a hacer el diagnóstico</button></div>
    </section>

    <!-- ===================== DETALLE DEL PLAN ===================== -->
    <section class="view view-detail hidden" id="viewDetail">
      <button type="button" class="back-link" id="backFromDetail">← Volver al resultado</button>
      <h3 class="detail-title" id="detailPlanName">—</h3>
      <div class="detail-price" id="detailPrice">—</div>
      <ul class="feature-list" id="featureList"></ul>
      <a class="btn-whatsapp" id="ctaWhatsapp2" href="#" target="_blank" rel="noopener">

    <!-- ===================== COMPARAR PLANES ===================== -->
    <section class="view view-compare hidden" id="viewCompare">
      <button type="button" class="back-link" id="backFromCompare">← Volver al resultado</button>
      <h3 class="detail-title">Comparar planes</h3>
      <div class="table-scroll">
        <table class="compare-table" id="compareTable"></table>
